<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS Tunnel Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
        .btn-primary {
            background-color: #238636;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2ea043;
        }
        .status-running {
            background-color: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid #238636;
        }
        .status-starting {
            background-color: rgba(187, 128, 9, 0.2);
            color: #d29922;
            border: 1px solid #9e6a03;
        }
        .status-stopped {
            background-color: rgba(110, 118, 129, 0.2);
            color: #8b949e;
            border: 1px solid #484f58;
        }
        .status-error {
            background-color: rgba(248, 81, 73, 0.2);
            color: #f85149;
            border: 1px solid #da3633;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center space-x-4">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3z"></path></svg>
                <h1 class="text-2xl font-bold text-white">KS Tunnel</h1>
            </div>
            <button onclick="document.getElementById('add-modal').classList.remove('hidden')" class="btn-primary px-4 py-2 rounded font-medium flex items-center">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add new Tunnel
            </button>
        </header>

        <div class="card overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-[#161b22] border-b border-[#30363d] text-[#8b949e] text-sm uppercase">
                    <tr>
                        <th class="px-6 py-4 font-semibold">Name</th>
                        <th class="px-6 py-4 font-semibold">Type</th>
                        <th class="px-6 py-4 font-semibold">From/To</th>
                        <th class="px-6 py-4 font-semibold">Status</th>
                        <th class="px-6 py-4 font-semibold">Action</th>
                    </tr>
                </thead>
                <tbody id="tunnel-list">
                    <!-- Tunnels will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="card p-8 w-full max-w-md">
            <h2 class="text-xl font-bold mb-6 text-white">Create New Tunnel</h2>
            <form id="tunnel-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Name</label>
                    <input type="text" name="name" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Provider Type</label>
                    <select name="type" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white" required>
                        <option value="cloudflare">Cloudflare Quick Tunnel</option>
                        <option value="ngrok">Ngrok SDK</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Local Address (e.g. 8080)</label>
                    <input type="text" name="local_addr" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white" placeholder="8080" required>
                </div>
                <div id="ngrok-token-field" class="mb-6 hidden">
                    <label class="block text-sm font-medium mb-2">Ngrok Auth Token</label>
                    <input type="password" name="token" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white">
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="document.getElementById('add-modal').classList.add('hidden')" class="px-4 py-2 text-[#8b949e] hover:text-white">Cancel</button>
                    <button type="submit" class="btn-primary px-4 py-2 rounded font-medium">Start Tunnel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
